<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTURE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  video.bg {
    position: fixed;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    z-index: 0;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 1;
  }
  .wrap {
    position: relative;
    z-index: 2;
    min-height: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  img.logo {
    width: 56px;
    height: auto;
    margin-bottom: 24px;
    opacity: 0.95;
  }
  img.wordmark {
    width: 108px;
    height: auto;
    display: block;
    margin: 0 auto 16px;
  }
  p.tag {
    font-weight: 400;
    color: #d8d8d8;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    margin: 0 0 48px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }
  a {
    color: #f0f0f0;
    text-decoration: none;
    border-bottom: 1px solid #666;
    padding-bottom: 1px;
    font-size: 0.85rem;
    font-weight: 400;
    letter-spacing: 0.01em;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  a:hover {
    color: #ffffff;
    border-color: #ffffff;
  }
  footer {
    margin-top: 72px;
    color: #ccc;
    font-size: 0.7rem;
    letter-spacing: 0.02em;
  }
</style>
</head>
